services:
  postgres:
    image: postgres:15-alpine
    container_name: bluelips_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bluelips
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluelips"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
